{% extends "base.html" %}

{% block title %}{{ title }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
             <div class="text-center mb-5">
                <h1 class="display-5 fw-bold">Bize Ulaşın</h1>
                <p class="lead text-muted">Her türlü soru, öneri ve geri bildiriminiz için buradayız.</p>
            </div>
            
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="row g-4 text-center">
                        
                        <!-- E-posta Kartı -->
                        <div class="col-md-12">
                            <div class="p-4 rounded-3 bg-light">
                                <div class="fs-1 text-primary mb-2">
                                    <i class="bi bi-envelope-at-fill"></i>
                                </div>
                                <h3 class="h5 fw-bold">E-posta</h3>
                                <p class="text-secondary mb-2">
                                    Teknik destek, üyelik ve diğer tüm konular için bize yazın.
                                </p>
                                <a href="mailto:{{ config.MAIL_USERNAME }}" class="fw-bold">{{ config.MAIL_USERNAME }}</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
