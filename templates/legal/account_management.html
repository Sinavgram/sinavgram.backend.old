{% extends "base.html" %}

{% block title %}{{ title }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold">{{ title }}</h1>
                <p class="lead text-muted">Kişisel verilerinizi yönetin ve hesap ayarlarınızı yapılandırın.</p>
            </div>

            <!-- Bildirim ve Yükleme Alanları -->
            <div id="messageArea" class="mb-4"></div>
            <div id="loading" class="text-center d-none mb-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Verileriniz kontrol ediliyor...</p>
            </div>

            <!-- Arayüz bu div'in içine JavaScript ile eklenecek -->
            <div id="content-area"></div>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('sorugram_token');
        const messageArea = document.getElementById('messageArea');
        const contentArea = document.getElementById('content-area');
        const loadingDiv = document.getElementById('loading');

        const showAlert = (message, type = 'info') => {
            messageArea.innerHTML = `<div class="alert alert-${type} text-center" role="alert">${message}</div>`;
        };

        const renderLockedState = () => {
            contentArea.innerHTML = `
            <div class="card shadow-sm border-warning">
                <div class="card-body p-4 text-center">
                    <div class="fs-1 text-warning mb-3"><i class="bi bi-shield-lock-fill"></i></div>
                    <h5 class="card-title fw-bold">Hesap Yönetimi Geçici Olarak Kilitlendi</h5>
                    <p class="card-text text-secondary">Hesabınızda yeni bir konumdan giriş tespit edildiği için bu bölüm geçici olarak kilitlenmiştir.</p>
                    <p class="card-text">Lütfen e-postanıza gönderilen güvenlik bildirimini kontrol edin veya linkin süresinin dolmasını (yaklaşık 24 saat) bekleyin.</p>
                </div>
            </div>`;
        };
        
        const renderUnlockedState = () => {
            contentArea.innerHTML = `
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4"><div class="d-flex align-items-center">
                    <div class="fs-2 text-primary me-3"><i class="bi bi-cloud-arrow-down-fill"></i></div>
                    <div><h5 class="card-title fw-bold">Verilerinizi İndirin</h5><p class="card-text text-secondary mb-0">Tüm verilerinizi içeren bir JSON dosyası indirin.</p></div>
                    <div class="ms-auto"><button id="download-data-btn" class="btn btn-outline-primary">İndir</button></div>
                </div></div>
            </div>
            <div class="card shadow-sm border border-danger">
                <div class="card-body p-4"><div class="d-flex align-items-center">
                    <div class="fs-2 text-danger me-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div><h5 class="card-title fw-bold text-danger">Hesabı Kalıcı Olarak Sil</h5><p class="card-text text-secondary mb-0"><strong>Bu işlem geri alınamaz.</strong></p></div>
                    <div class="ms-auto"><button id="delete-account-btn" class="btn btn-danger">Hesabımı Sil</button></div>
                </div></div>
            </div>`;
            attachActionListeners(); // Butonlara event listener ekle
        };

        if (!token) {
            showAlert('Bu sayfayı kullanabilmek için lütfen <a href="{{ url_for("main_bp.login_page") }}" class="alert-link">giriş yapın</a>.', 'warning');
            return;
        }

        // Token varsa, kilit durumunu backend'den kontrol et
        loadingDiv.classList.remove('d-none');
        fetch("{{ url_for('user_bp.get_own_profile') }}", {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(response => {
            if (!response.ok) throw new Error('Oturum bilgileri alınamadı.');
            return response.json();
        })
        .then(data => {
            if (data.is_account_locked) {
                renderLockedState();
            } else {
                renderUnlockedState();
            }
        })
        .catch(error => {
            showAlert(error.message, 'danger');
        })
        .finally(() => {
            loadingDiv.classList.add('d-none');
        });

        function attachActionListeners() {
            // Veri İndirme Mantığı
            const downloadBtn = document.getElementById('download-data-btn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', () => { /* ... veri indirme fetch kodu ... */ });
            }

            // Hesap Silme Mantığı
            const deleteBtn = document.getElementById('delete-account-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => { /* ... hesap silme fetch kodu ... */ });
            }
        }
    });
    </script>
{% endblock %}
