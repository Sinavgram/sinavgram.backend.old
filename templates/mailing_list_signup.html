{% extends "base.html" %}

{% block title %}{{ title }} - {{ super() }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 d-flex align-items-center justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-3 p-4 p-sm-5">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <svg class="mx-auto text-primary" style="height: 3rem; width: 3rem;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                        </svg>
                    </div>
                    
                    <h1 class="h2 fw-bold mb-2">{{ title }}</h1>
                    <p class="text-muted">
                        Soru bankamızdaki güncellemelerden ve yeni özelliklerden ilk siz haberdar olun.
                    </p>
                
                    <form id="subscribe-form" class="mt-4">
                        <div class="mb-3">
                            <label for="email" class="form-label visually-hidden">E-posta Adresi</label>
                            <input id="email" name="email" type="email" autocomplete="email" required class="form-control form-control-lg" placeholder="E-posta adresinizi girin">
                        </div>
                        <div class="d-grid">
                            <button type="submit" id="submit-button" class="btn btn-primary btn-lg">
                                Abone Ol
                            </button>
                        </div>
                    </form>

                    <div id="response-message" class="mt-3 text-center small"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        const form = document.getElementById('subscribe-form');
        const emailInput = document.getElementById('email');
        const responseMessage = document.getElementById('response-message');
        const submitButton = document.getElementById('submit-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitButton.disabled = true;
            submitButton.innerHTML = `
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Gönderiliyor...
            `;
            responseMessage.textContent = '';
            responseMessage.className = 'mt-3 text-center small'; // Stili sıfırla

            const email = emailInput.value;
            const apiEndpoint = "{{ url_for('community_bp.add_email_to_list') }}";

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email }),
                });
                const result = await response.json();
                if (response.ok) {
                    responseMessage.textContent = result.message;
                    responseMessage.classList.add('text-success', 'fw-bold');
                    emailInput.value = '';
                } else {
                    responseMessage.textContent = result.message || 'Bir hata oluştu.';
                    responseMessage.classList.add('text-danger', 'fw-bold');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                responseMessage.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
                responseMessage.classList.add('text-danger', 'fw-bold');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Abone Ol';
            }
        });
    </script>
{% endblock %}
