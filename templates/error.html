<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata Oluştu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Açık gri arkaplan */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background-color: #ffffff; /* Beyaz kutu arkaplanı */
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="display-1 text-danger">404</h1>
        <h2 class="mt-3">Sayfa Bulunamadı</h2>
        <p class="lead">Üzgünüz, aradığınız sayfa mevcut değil.</p>
        <hr class="my-4">
        <p>Lütfen ana sayfaya dönmek için aşağıdaki butona tıklayın.</p>
        <a href="https://www.sinavgram.com" class="btn btn-primary btn-lg mt-3">Anasayfaya Dön</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
